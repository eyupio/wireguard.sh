name: Validate site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The default shallow checkout has no HEAD^, so the whitespace
          # check cannot diff. Full history also gives us the PR base.
          fetch-depth: 0

      - name: Validate static content
        run: python3 scripts/validate_site.py

      - name: Check whitespace
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$base...HEAD"
          fi

      - name: Lint HTML
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npx --yes html-validate@9.7.1 index.html

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npx playwright test
